name: release

# Builds the plugin, publishes it as a GitHub release and adds it to manifest.json on main,
# which is the Jellyfin plugin repository:
#   https://raw.githubusercontent.com/<owner>/<repo>/main/manifest.json
#
# Release: bump the version/changelog in src/Jellyfin.Plugin.Jelly2FA/meta.json, then
#   git tag v0.0.2.0 && git push origin v0.0.2.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      META: src/Jellyfin.Plugin.Jelly2FA/meta.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Resolve version
        id: v
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3.4"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=jelly2fa_$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "changelog<<EOF_CHANGELOG" >> "$GITHUB_OUTPUT"
          jq -r '.changelog // ""' "$META" >> "$GITHUB_OUTPUT"
          echo "EOF_CHANGELOG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ZIP_NAME: ${{ steps.v.outputs.zip }}
          TIMESTAMP: ${{ steps.v.outputs.timestamp }}
        run: |
          OUT="artifacts/Jelly2FA_$VERSION"
          dotnet publish src/Jellyfin.Plugin.Jelly2FA -c Release -o "$OUT" \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"
          rm -f "$OUT"/*.deps.json
          jq --arg v "$VERSION" --arg t "$TIMESTAMP" '.version = $v | .timestamp = $t' \
            "$META" > "$OUT/meta.json"
          # Jellyfin extracts the zip straight into the plugin folder: files must be at the root.
          (cd "$OUT" && zip -r "../$ZIP_NAME" .)
          unzip -l "artifacts/$ZIP_NAME"
          echo "MD5=$(md5sum "artifacts/$ZIP_NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.v.outputs.zip }}
          CHANGELOG: ${{ steps.v.outputs.changelog }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "artifacts/$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "artifacts/$ZIP_NAME" --title "Jelly2FA $TAG" \
              --notes "$CHANGELOG"$'\n\nMD5: `'"$MD5"'`'
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Update manifest.json on main
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ZIP_NAME: ${{ steps.v.outputs.zip }}
          TIMESTAMP: ${{ steps.v.outputs.timestamp }}
          CHANGELOG: ${{ steps.v.outputs.changelog }}
        working-directory: repo-main
        run: |
          python3 ../.github/scripts/update-manifest.py \
            --manifest manifest.json \
            --meta "../$META" \
            --version "$VERSION" \
            --source-url "https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP_NAME" \
            --checksum "$MD5" \
            --timestamp "$TIMESTAMP" \
            --changelog "$CHANGELOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then echo "manifest unchanged"; exit 0; fi
          git commit -m "Update plugin manifest for $TAG [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
