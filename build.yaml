overview: "Email-code two-factor authentication for remote sign-ins"
description: >
  Requires an emailed one-time code (typed directly after the password) for sign-ins that arrive
  through the reverse proxy. Direct LAN/Tailscale sign-ins use the password only. No client changes.
category: "Authentication"
